{% extends "base.html" %}
{% block title %}Log in · Ledger{% endblock %}

{% block content %}
<div class="auth">
  <section class="panel auth-card">
    <h1>Welcome back</h1>
    <p class="lede">Log in to see your balance, budget and statistics.</p>

    <form method="post" class="stack">
      <label>
        Email
        <input type="email" name="email" value="{{ email }}" required autofocus>
      </label>

      <label>
        Password
        <input type="password" name="password" required>
      </label>

      <button class="btn-block" type="submit">Log in</button>
    </form>

    <p class="auth-foot">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </section>
</div>
{% endblock %}
